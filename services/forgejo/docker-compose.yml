# Based on https://forgejo.org/docs/v15.0/admin/installation/docker/
# FORGEJO_DOMAIN and FORGEJO_SSH_BIND are set by the systemd unit in default.nix.
networks:
  forgejo:
    external: false

services:
  server:
    image: codeberg.org/forgejo/forgejo:15
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__server__DOMAIN=${FORGEJO_DOMAIN}
      - FORGEJO__server__ROOT_URL=https://${FORGEJO_DOMAIN}/
      - FORGEJO__server__SSH_DOMAIN=${FORGEJO_DOMAIN}
      - FORGEJO__server__SSH_PORT=222
      - FORGEJO__service__DISABLE_REGISTRATION=true
      # never serve the install wizard, even if app.ini is lost
      - FORGEJO__security__INSTALL_LOCK=true
    # provides FORGEJO__database__PASSWD, generated on the server
    env_file: /var/lib/secrets/forgejo.env
    restart: always
    networks:
      - forgejo
    volumes:
      - /var/lib/forgejo/data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      # web is only ever reachable through Caddy or an SSH tunnel
      - "127.0.0.1:3000:3000"
      - "${FORGEJO_SSH_BIND}:222:22"
    depends_on:
      - db

  db:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_DB=forgejo
    # provides POSTGRES_PASSWORD
    env_file: /var/lib/secrets/forgejo.env
    networks:
      - forgejo
    volumes:
      - /var/lib/forgejo/postgres:/var/lib/postgresql/data

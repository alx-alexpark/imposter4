name: Update flake.lock

on:
  schedule:
    # 06:00 UTC = 1-2am Eastern, before the server's 3am autoUpgrade
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        run: |
          sh <(curl -L https://nixos.org/nix/install) --no-daemon
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Update flake inputs
        run: nix flake update

      - name: Build system to check the update
        run: nix build .#nixosConfigurations.imposter4.config.system.build.toplevel --no-link

      - name: Commit and push
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update flake.lock"
          git push
